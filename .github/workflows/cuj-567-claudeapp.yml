name: cuj-567 claude app probe

# Probe for #567: review with the official Claude GitHub App token (no github_token input).

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Activate project
        run: echo github.com_pecotcraft_pecot-sandbox_sandbox.json > .pecot/config/projects/.active

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        env:
          PECOT_GITHUB_COM_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/pecotcraft/pecot.git
          plugins: pecot-w@pecot
          classify_inline_comments: "false"
          show_full_output: true
          prompt: |
            This is a probe for pecotcraft/pecot#567. Do these in order and report each result verbatim, then stop.
            C1. Call mcp__plugin_pecot-w_pecot-workflow__pr_show with pr_ref "${{ github.repository }}/${{ github.event.pull_request.number }}". Report success or the exact error.
            C2. Call mcp__github_inline_comment__create_inline_comment on probe/sample.py line 2 with body "**F-01** [tech] probe: empty list divides by zero." and confirmed true. Report the returned fields.
            C3. Call mcp__plugin_pecot-w_pecot-workflow__issue_comment with issue_ref "${{ github.repository }}/${{ github.event.pull_request.number }}", template "review-findings", and this multi-line message:
            ## Findings — probe for #567 with the Claude App
            
            ### General — no non-inline findings
            
            - 非インライン指摘なし
            
            ### Disposition — probe only
            
            - **F-01** probe — 対応不要 (probe)
            Report the result or the exact error.
          claude_args: >-
            --permission-mode default
            --max-turns 15
            --allowedTools "Read,Glob,Grep,mcp__plugin_pecot-w_pecot-workflow__pr_show,mcp__plugin_pecot-w_pecot-workflow__issue_comment,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,AskUserQuestion,WebFetch,WebSearch"
