# cuj/793: release-create のリリースが on: release を起こすかを確かめる試し。確かめの後に消す
name: cuj 793 release probe
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "release published: $TAG"
