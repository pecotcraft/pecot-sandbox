name: cuj-567 mention probe

# Probe for #567: re-review by a comment phrase. Lives on pecot-sandbox main only while probing.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: >-
      ${{
        vars.PECOT_AGENT_APP_CLIENT_ID != '' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        startsWith(github.event.comment.body, vars.PECOT_REVIEW_TRIGGER_PHRASE || '/pecot-review')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: ${{ fromJSON(vars.PECOT_REVIEW_TIMEOUT_MINUTES || '30') }}
    concurrency:
      group: pecot-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Issue token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PECOT_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PECOT_AGENT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      # issue_comment carries no head repo or draft flag; read them from the PR.
      - name: Check PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          ASSOC: ${{ github.event.comment.author_association }}
        run: |
          read -r head draft state < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.repo.full_name, .draft, .state] | @tsv')
          ok=false
          if [ "$head" = "$GITHUB_REPOSITORY" ] && [ "$draft" = false ] && [ "$state" = open ]; then ok=true; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "- actor: $ACTOR / association: $ASSOC / head: $head / draft: $draft / state: $state / ok: $ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.pr.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Activate project
        if: steps.pr.outputs.ok == 'true'
        run: echo github.com_pecotcraft_pecot-sandbox_sandbox.json > .pecot/config/projects/.active

      - name: Setup Node
        if: steps.pr.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Review
        if: steps.pr.outputs.ok == 'true'
        id: claude
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        env:
          PECOT_GITHUB_COM_TOKEN: ${{ steps.token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          plugin_marketplaces: https://github.com/pecotcraft/pecot.git
          plugins: pecot-w@pecot
          show_full_output: true
          prompt: |
            This is a mention probe for pecotcraft/pecot#567. Do these and report each result verbatim, then stop. Do not post anything.
            M1. Read the file probe/sample.py and print its first line, or the exact error.
            M2. Call mcp__plugin_pecot-w_pecot-workflow__pr_show with pr_ref "${{ github.repository }}/${{ github.event.issue.number }}" and report the head branch and the changed files.
          claude_args: >-
            --permission-mode default
            --max-turns 10
            --allowedTools "Read,Glob,Grep,mcp__plugin_pecot-w_pecot-workflow__pr_show"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,AskUserQuestion,WebFetch,WebSearch"
