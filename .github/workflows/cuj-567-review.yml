name: cuj-567 review probe

# Probe for spec 027 Phase 1 (#567). Shaped after specs/027-auto-revise-on-pr/contracts/workflow-template.md.
# Placed only on cuj/567-* branches of pecot-sandbox; never merged.

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  review:
    if: >-
      ${{
        vars.PECOT_AGENT_APP_CLIENT_ID != '' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        (
          (github.event.action == 'labeled' && github.event.label.name == (vars.PECOT_REVIEW_LABEL || 'pecot-review')) ||
          (github.event.action != 'labeled' &&
            (github.event.pull_request.user.type != 'Bot' ||
             contains(fromJSON(vars.PECOT_REVIEW_ALLOWED_BOTS || '[]'), github.event.pull_request.user.login)))
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: ${{ vars.PECOT_REVIEW_TIMEOUT_MINUTES || 30 }}
    concurrency:
      group: pecot-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Probe context
        run: |
          {
            echo "## context"
            echo "- event.action: ${EV_ACTION}"
            echo "- github.actor: ${ACTOR}"
            echo "- label: ${LABEL}"
            echo "- pr.user.login: ${PR_LOGIN}"
            echo "- pr.user.type: ${PR_TYPE}"
            echo "- started: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EV_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          LABEL: ${{ github.event.label.name }}
          PR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_TYPE: ${{ github.event.pull_request.user.type }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Issue token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PECOT_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PECOT_AGENT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        env:
          PECOT_GITHUB_COM_TOKEN: ${{ steps.token.outputs.token }}
        with:
          anthropic_federation_rule_id: ${{ vars.PECOT_AGENT_ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.PECOT_AGENT_ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.PECOT_AGENT_ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.PECOT_AGENT_ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ steps.token.outputs.token }}
          plugin_marketplaces: https://github.com/pecotcraft/pecot.git
          plugins: pecot-w@pecot
          allowed_bots: ${{ join(fromJSON(vars.PECOT_REVIEW_ALLOWED_BOTS || '[]'), ',') }}
          show_full_output: true
          prompt: |
            This is a verification run for pecotcraft/pecot#567, in ${{ github.repository }} PR #${{ github.event.pull_request.number }}. Do the steps below in order. Do not stop at a failure; record it and go on. Finally print a section titled PROBE RESULTS with one line per step: step id, tool, ok/denied/error, and the exact error text or the key fields asked for.
            
            P1. Call mcp__plugin_pecot-w_pecot-workflow__pr_show with pr_ref "${{ github.repository }}/${{ github.event.pull_request.number }}" and json true. Report whether it succeeded and the changed files.
            P2. Call mcp__plugin_pecot-w_pecot-workflow__pr_show again with reviews true. Report the number of review threads returned.
            P3. Call mcp__plugin_pecot-w_pecot-workflow__issue_show with issue_ref "${{ github.repository }}/${{ github.event.pull_request.number }}". Report success or the error.
            P4. Call mcp__plugin_pecot-w_pecot-workflow__pr_restack with check true. Report the output or the error.
            P5. Use the Agent tool to start the subagent pecot-w:w-reviewer. Tell it: "Review the file probe/sample.py in the current directory for correctness bugs. Before reviewing, try these three tools and report each result verbatim: (a) Read on probe/sample.py, (b) mcp__plugin_pecot-w_pecot-workflow__pr_show with pr_ref ${{ github.repository }}/${{ github.event.pull_request.number }}, (c) Bash with the command `echo probe`. Then return at most two findings, each with a line number." Report what the subagent returned, including the three tool results.
            P6. Call mcp__github_inline_comment__create_inline_comment with confirmed true, path probe/sample.py, line 3, body "**F-01** [tech] probe inline comment for #567". Report the full tool result text, especially any html_url or comment id.
            P7. Call mcp__github_inline_comment__create_inline_comment with confirmed true, path probe/sample.py, and no line, body "**F-02** [tech] probe file-level comment". Report the result or the error.
            P8. Call mcp__plugin_pecot-w_pecot-workflow__pr_show with reviews true again. Report the number of review threads and whether the thread from P6 appears with its id.
            P9. Call mcp__plugin_pecot-w_pecot-workflow__issue_comment with issue_ref "${{ github.repository }}/${{ github.event.pull_request.number }}", template "review-findings", and message set to this multi-line text:
            ## Findings — probe for #567
            
            ### General — no non-inline findings
            
            - 非インライン指摘なし
            
            ### Disposition — probe only
            
            - **F-01** probe inline comment — 対応不要 (probe)
            Report the result or the validation error verbatim.
            P10. List every tool name available to you whose name contains "resolve" or "reply". Report the list (empty if none).
          claude_args: >-
            --permission-mode default
            --max-turns ${{ vars.PECOT_REVIEW_MAX_TURNS || 60 }}
            --include-hook-events
            --allowedTools "Read,Glob,Grep,mcp__plugin_pecot-w_pecot-workflow__pr_show,mcp__plugin_pecot-w_pecot-workflow__issue_show,mcp__plugin_pecot-w_pecot-workflow__pr_restack,mcp__plugin_pecot-w_pecot-workflow__issue_comment,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,AskUserQuestion,WebFetch,WebSearch"

      - name: Probe outcome
        if: always()
        run: |
          {
            echo "## outcome"
            echo "- finished: $(date -u +%FT%TZ)"
            echo "- job.status: ${JOB_STATUS}"
            echo "- claude.outcome: ${OUTCOME}"
            echo "- claude.outputs.conclusion: ${CONCLUSION}"
            EXEC_FILE="${EXEC_FILE:-${RUNNER_TEMP}/claude-execution-output.json}"
            if [ -f "${EXEC_FILE}" ]; then
              echo "- result: $(jq -c '[.[] | select(.type == "result")] | last | {subtype, is_error, num_turns}' "${EXEC_FILE}")"
            else
              echo "- execution_file: missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.claude.outcome }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
