name: cuj-567 make bot PR

# Opens a PR authored by the sandbox App from vars.PECOT_PROBE_BOT_HEAD, pushed beforehand by the agent (#567 T008).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  open:
    if: ${{ github.event.label.name == 'cuj-make-bot-pr' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Issue token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PECOT_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PECOT_AGENT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      - name: Open PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD: ${{ vars.PECOT_PROBE_BOT_HEAD }}
          TITLE: ${{ format('{0} (bot)', github.event.pull_request.title) }}
        run: |
          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$HEAD" \
            --title "$TITLE" --body "Probe PR for pecotcraft/pecot#567 T008."
